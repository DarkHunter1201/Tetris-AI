[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-ai"
version = "1.2.0b1"
description = "Neuroevolutionary Tetris training visualizer"
requires-python = ">=3.10"
dependencies = [
    "torch==2.12.1",
    "numpy==2.5.1",
    "pygame==2.6.1",
    "psutil==7.0.0",
    "nvidia-ml-py==13.580.82",
]

[tool.setuptools.packages.find]
where = ["src"]
